name: Python syntax validation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: python -m compileall -q .
