name: HT NEXUS tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

concurrency:
  group: ht-nexus-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile application modules
        run: python -m compileall -q app.py backtest.py indicators.py market_data.py strategy_engine.py
      - name: Run unit tests
        run: python -m pytest -q
